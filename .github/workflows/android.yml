name: Android quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Use portable Gradle distribution on CI
        run: python3 tools/portable_gradle.py
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test docs
      - run: flutter analyze
      - run: flutter test --coverage
      - run: python3 tools/check_coverage.py
      - run: python3 -m unittest discover -s functions -p 'test_*.py'
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/firebase-tests/package-lock.json
      - run: npm ci --prefix tools/firebase-tests
      - run: node tools/firebase-tests/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --only firestore --project demo-air-quality-monitor 'node --test tools/firebase-tests/rules.test.mjs'
